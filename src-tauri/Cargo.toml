[package]
name = "screen-hopper"
version = "1.0.0"
description = "One mouse, keyboard and clipboard across every computer on your desk."
edition = "2021"

[lib]
name = "screen_hopper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1.3"
snow = "0.9"
sha2 = "0.10"
mdns-sd = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "fs"] }
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
hostname = "0.4"
dirs = "5"
rand = "0.8"
hex = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
clipboard-rs = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_log-sys = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-autostart = "2"
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "input_capture"] }
evdev = "0.13.2"
futures-util = "0.3.34"
reis = { version = "0.7.1", features = ["tokio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
